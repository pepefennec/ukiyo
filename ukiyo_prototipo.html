<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ukiyo — Un espacio para volver a ti</title>
<style>
:root{--cream:#f8f5ee;--paper:#fffdf8;--green:#243b32;--green2:#526b53;--sage:#e9e9dc;--sage2:#d5d8c7;--gold:#d7b777;--ink:#28382f;--muted:#74766b;--line:#e7e0d3;--shadow:0 12px 35px rgba(45,54,43,.06)}
*{box-sizing:border-box}body{margin:0;background:#efede6;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #c8a968;outline-offset:2px}.app{max-width:1100px;margin:28px auto;padding:0 18px 30px}.shell{overflow:hidden;border:1px solid #e1dacd;border-radius:24px;background:var(--cream);box-shadow:var(--shadow)}.hero{background:var(--green);color:#faf5e9;padding:25px 28px 22px}.brandrow{display:flex;align-items:center;gap:13px}.brandmark{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:var(--gold);color:var(--green);font-size:24px}.brand{font-family:Georgia,serif;font-size:31px;letter-spacing:-1px;line-height:1.05}.tagline{font-size:12px;color:#d8ddcf;margin-top:4px}.version{margin-left:auto;border:1px solid #53675a;border-radius:99px;padding:5px 10px;color:#e4e6dc;font-size:11px;white-space:nowrap}.hero p{margin:20px 0 0;color:#f2eee4;font-size:14px;max-width:560px}.nav{display:flex;gap:7px;padding:13px 20px;background:#f4f0e7;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav button{flex:1;border:0;border-radius:12px;background:transparent;color:#77786d;padding:11px 8px;font-size:13px;display:flex;align-items:center;justify-content:center;gap:8px}.nav button.active{background:#e4e4d7;color:var(--green);font-weight:650}.nav .ico{font-size:17px}.main{padding:27px;min-height:610px}.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#8b795a;font-weight:700;margin-bottom:7px}.heading{font-family:Georgia,serif;font-size:clamp(27px,4vw,36px);line-height:1.12;letter-spacing:-.6px;margin:0 0 8px;color:var(--ink);font-weight:500}.sub{color:var(--muted);margin:0;max-width:680px;font-size:14px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:23px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px}.soft{background:var(--sage);border:1px solid #e0e1d4;border-radius:18px;padding:18px}.field{margin-top:22px}.field h3,.panel h3,.soft h3{font-size:15px;margin:0 0 11px;font-weight:700}.hint{color:#858477;font-size:12px;margin-top:7px}.choices{display:grid;gap:8px}.choices.emotions{grid-template-columns:repeat(5,minmax(0,1fr))}.choice{border:1px solid var(--line);background:#f5f1e8;border-radius:13px;padding:12px 9px;text-align:center;color:#4b554b;min-height:67px;transition:.15s}.choice .emoji{display:block;font-size:23px;margin-bottom:3px}.choice .label{font-size:12px}.choice.selected{background:#e4e6d8;border-color:#71846b;box-shadow:inset 0 0 0 1px #71846b}.choices.cols{grid-template-columns:repeat(3,minmax(0,1fr))}.choice.compact{min-height:0;padding:12px 13px;text-align:left;display:flex;gap:9px;align-items:center;font-size:13px}.choice.compact .emoji{font-size:17px;margin:0}.choices.intentions{grid-template-columns:repeat(3,minmax(0,1fr))}.note{width:100%;min-height:86px;resize:vertical;border:1px solid #ddd7ca;background:#fffdf8;border-radius:12px;padding:12px;color:var(--ink)}.btn{border:1px solid transparent;border-radius:12px;padding:11px 15px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s}.btn.primary{background:var(--green);color:#fffaf0}.btn.primary:hover{background:#304b3e}.btn.secondary{background:#f5f1e8;border-color:var(--line);color:#4d5b4d}.btn.ghost{background:transparent;color:var(--green2);border-color:transparent}.btn.danger{background:#f7e9e4;color:#8d4938;border-color:#edd4cb}.btn.full{width:100%;margin-top:20px;padding:14px}.btn:disabled{opacity:.4;cursor:not-allowed}.inline-actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,.8fr);gap:18px}.activity-list{display:grid;gap:12px}.activity{display:flex;gap:14px;align-items:flex-start;padding:15px;background:var(--paper);border:1px solid var(--line);border-radius:16px}.activity-icon{width:48px;height:48px;flex:0 0 48px;border-radius:14px;background:#efe8d9;display:grid;place-items:center;font-size:22px}.activity-content{min-width:0;flex:1}.activity h3{margin:1px 0 3px;font-size:15px}.activity p{margin:0;color:var(--muted);font-size:12px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tag{background:#f0ede4;color:#626a5c;border-radius:99px;padding:4px 8px;font-size:11px}.activity-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}.activity-actions .btn{padding:8px 10px;font-size:12px}.small-label{font-size:12px;color:var(--muted)}.daily-summary{display:flex;gap:13px;align-items:center}.mood-tile{width:50px;height:50px;border-radius:14px;background:var(--sage2);display:grid;place-items:center;font-size:26px;flex-shrink:0}.daily-summary h3{margin:0 0 4px;font-size:16px}.daily-summary p{margin:0;font-size:12px;color:#626a5c}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--paper);border-radius:14px;padding:15px;border:1px solid var(--line)}.stat .symbol{font-size:19px;color:var(--green2)}.stat strong{display:block;font-family:Georgia,serif;font-size:28px;font-weight:500;margin:4px 0}.stat span{font-size:12px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-row{display:grid;gap:6px}.form-row label{font-size:12px;color:#5e675b;font-weight:650}.form-row input,.form-row select,.search{width:100%;border:1px solid #ddd7ca;background:#fffdf8;border-radius:10px;padding:10px 11px;color:var(--ink)}.form-row textarea{width:100%;border:1px solid #ddd7ca;background:#fffdf8;border-radius:10px;padding:10px;min-height:75px}.form-row.fullrow{grid-column:1/-1}.library-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.library-toolbar .search{flex:1;min-width:100px}.library-toolbar select{border:1px solid #ddd7ca;background:#fffdf8;border-radius:10px;padding:10px;max-width:180px}.empty{text-align:center;padding:35px 20px;color:var(--muted)}.empty .symbol{font-size:32px;margin-bottom:8px}.empty h3{color:var(--ink);margin:0 0 5px}.empty p{font-size:13px;max-width:350px;margin:0 auto 16px}.session-card{text-align:center;padding:30px 22px;background:var(--sage);border:1px solid #dfe1d2;border-radius:20px}.session-symbol{margin:0 auto 14px;width:76px;height:76px;border-radius:24px;background:var(--sage2);display:grid;place-items:center;font-size:34px}.session-card h2{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:0 0 8px}.session-card p{max-width:400px;margin:0 auto 20px;color:#5e675b;font-size:13px}.timer{font-family:Georgia,serif;font-size:38px;margin:12px 0;color:var(--green)}.footer{padding:14px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;color:#858477;font-size:11px}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--green);color:white;border-radius:12px;padding:11px 16px;box-shadow:var(--shadow);z-index:20;pointer-events:none;transition:.2s;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;background:#17251ecc;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.open{display:flex}.modal{background:var(--cream);border-radius:20px;padding:22px;width:min(570px,100%);max-height:90vh;overflow:auto;box-shadow:0 24px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-family:Georgia,serif;font-weight:500;font-size:25px;margin:0}.close{border:0;background:#e9e4d9;border-radius:10px;width:35px;height:35px;font-size:20px;color:var(--green)}.modal-actions{display:flex;gap:9px;margin-top:18px;justify-content:flex-end}.hidden{display:none!important}.session-item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.session-item:last-child{border-bottom:0}.session-item h4{margin:0 0 4px;font-size:14px}.session-item p{margin:0;color:var(--muted);font-size:12px}.barrow{display:grid;grid-template-columns:86px 1fr 24px;align-items:center;gap:9px;margin:11px 0;font-size:12px;color:#5e675b}.bar{height:8px;border-radius:99px;background:#e6e1d6;overflow:hidden}.bar i{display:block;height:100%;background:#829477;border-radius:99px}.link-preview{border:1px dashed #c9c5b8;background:#f5f1e8;padding:12px;border-radius:12px;font-size:12px;color:var(--muted)}
@media(max-width:720px){.app{margin:0;padding:0}.shell{border-radius:0;border-left:0;border-right:0}.hero{padding:21px 18px}.main{padding:21px 16px;min-height:600px}.nav{padding:9px 7px;gap:2px}.nav button{flex-direction:column;gap:3px;padding:9px 2px;font-size:11px}.layout{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.choices.cols,.choices.intentions{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:1fr}.form-row.fullrow{grid-column:auto}.activity{padding:12px}.activity-icon{width:42px;height:42px;flex-basis:42px}.footer{padding:13px 16px}.version{font-size:10px}.brand{font-size:29px}}
@media(max-width:380px){.choices.emotions{gap:4px}.choice{padding:9px 3px}.choice .label{font-size:10px}.choices.emotions .emoji{font-size:20px}.main{padding:18px 12px}.library-toolbar{flex-wrap:wrap}.library-toolbar .search{flex-basis:100%}}
</style>
</head>
<body>
<div class="app"><div class="shell">
<header class="hero"><div class="brandrow"><div class="brandmark">☼</div><div><div class="brand">ukiyo</div><div class="tagline">Un espacio para volver a ti.</div></div><span class="version">PROTOTIPO · 01</span></div><p>No tienes que aprovechar cada minuto. Solo elegir cómo quieres vivirlo.</p></header>
<nav class="nav" aria-label="Navegación principal"><button data-tab="pausa" class="active"><span class="ico">☼</span><span>Mi pausa</span></button><button data-tab="explorar"><span class="ico">⌖</span><span>Explorar</span></button><button data-tab="actividades"><span class="ico">▤</span><span>Actividades</span></button><button data-tab="historia"><span class="ico">◷</span><span>Mi historia</span></button></nav>
<main class="main" id="main"></main>
<footer class="footer"><span>UKIYO · Prototipo interactivo</span><span>Vive el momento.</span></footer>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="modalBackdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Nueva actividad</h2><button class="close" id="closeModal" aria-label="Cerrar">×</button></div><div id="modalBody"></div></section></div>
<script>
const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
const defaults=[
{id:1,name:'Escuchar música',category:'Desconexión',duration:'15–30 min',energy:'Baja',icon:'♫',status:'Pendiente',type:'Recurrente',description:'Pon algo que te guste y deja que el momento fluya.',url:'',image:''},
{id:2,name:'Dibujar un rato',category:'Creatividad',duration:'Flexible',energy:'Media',icon:'✎',status:'Pendiente',type:'Recurrente',description:'Crear sin preocuparte por el resultado.',url:'',image:''},
{id:3,name:'Leer',category:'Tranquilidad',duration:'15–30 min',energy:'Baja',icon:'▤',status:'Pendiente',type:'Recurrente',description:'Leer unas páginas sin prisa.',url:'',image:''},
{id:4,name:'Salir a caminar',category:'Exploración',duration:'30–60 min',energy:'Media',icon:'↗',status:'Pendiente',type:'Recurrente',description:'Cambiar de ambiente y recorrer un lugar.',url:'',image:''},
{id:5,name:'Ver una película',category:'Entretenimiento',duration:'1–2 h',energy:'Baja',icon:'▣',status:'Pendiente',type:'Experiencia',description:'Una película que tenías ganas de ver.',url:'',image:''}
];
const state={tab:'pausa',mood:'neutral',energy:'Baja',time:'30 minutos',intention:'Desconectar',dailyNote:'',dailySaved:false,activities:defaults.map(x=>({...x})),history:[],activeSession:null,filter:'Todas',search:'',editingId:null,sessionTick:null};
const moodOptions=[['agobiado','😮‍💨','Agobiado'],['bajo','😔','Bajo de ánimo'],['neutral','😐','Neutral'],['tranquilo','😌','Tranquilo'],['animado','😊','Animado']];
const energyOptions=['Baja','Media','Alta','Variable'];
const timeOptions=['15 minutos','30 minutos','1 hora','1–2 horas','Flexible'];
const intentions=[['Desconectar','☁'],['Crear','✎'],['Explorar','⌖'],['Tranquilizarme','☕'],['Entretenerme','▣'],['Lo que surja','✧']];
const cats=['Desconexión','Creatividad','Exploración','Tranquilidad','Entretenimiento'];
const durationOptions=['5–15 min','15–30 min','30–60 min','1–2 h','Más de 2 h','Flexible'];
const iconFor=c=>({'Desconexión':'☁','Creatividad':'✎','Exploración':'⌖','Tranquilidad':'☕','Entretenimiento':'▣'}[c]||'✧');
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
function setTab(tab){state.tab=tab;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
$$('.nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function selectButtons(items,current,attr,kind=''){return items.map(item=>{let val,label,emoji='';if(Array.isArray(item)){[val,emoji,label]=item}else{val=item;label=item}return `<button type="button" class="choice ${kind} ${current===val?'selected':''}" data-${attr}="${esc(val)}">${emoji?`<span class="emoji">${emoji}</span>`:''}<span class="label">${esc(label)}</span></button>`}).join('')}
function renderPausa(){return `<div class="eyebrow">Tu momento de transición</div><h1 class="heading">Deja el día afuera.</h1><p class="sub">Antes de elegir qué hacer, tómate un momento para reconocer cómo llegas.</p>
<div class="field"><h3>¿Cómo te sientes?</h3><div class="choices emotions">${selectButtons(moodOptions,state.mood,'mood')}</div></div>
<div class="field"><h3>¿Cuánta energía tienes?</h3><div class="choices cols">${selectButtons([['Baja','◌','Baja · necesito algo sencillo'],['Media','◐','Media · puedo hacer algo tranquilo'],['Alta','✧','Alta · tengo ganas de moverme o crear']],state.energy,'energy','compact')}</div></div>
<div class="field"><h3>¿Cuánto tiempo tienes para ti?</h3><div class="choices cols">${selectButtons(timeOptions,state.time,'time','compact')}</div></div>
<div class="field"><h3>¿Qué te gustaría encontrar hoy?</h3><div class="choices intentions">${selectButtons(intentions,state.intention,'intention','compact')}</div></div>
<div class="field"><h3>¿Algo que quieras dejar anotado?</h3><textarea class="note" id="dailyNote" placeholder="Lo que traes en la cabeza, si quieres...">${esc(state.dailyNote)}</textarea><div class="hint">Opcional. No necesitas explicar ni resolver nada.</div></div>
<button class="btn primary full" id="enterExplore">Entrar a Ukiyo <span>→</span></button><div class="hint" style="text-align:center">Este cuestionario es una pausa, no una evaluación.</div>`}
function timeFits(activity){const t=state.time,d=activity.duration;if(t==='Flexible'||d==='Flexible')return true;const rank={'5–15 min':1,'15–30 min':2,'30–60 min':3,'1–2 h':4,'Más de 2 h':5};const tr={'15 minutos':1,'30 minutos':2,'1 hora':3,'1–2 horas':4,'Flexible':5};return (rank[d]||3)<=(tr[t]||3)+1}
function energyFits(a){if(state.energy==='Baja')return a.energy==='Baja'||a.energy==='Variable';if(state.energy==='Media')return a.energy!=='Alta';return true}
function intentionFits(a){switch(state.intention){case'Crear':return a.category==='Creatividad';case'Explorar':return a.category==='Exploración';case'Tranquilizarme':return a.category==='Tranquilidad'||a.energy==='Baja';case'Entretenerme':return a.category==='Entretenimiento';case'Desconectar':return ['Desconexión','Tranquilidad','Entretenimiento'].includes(a.category);default:return true}}
function recommendations(){let active=state.activities.filter(a=>a.status!=='Archivada');return active.map(a=>({...a,score:(intentionFits(a)?4:0)+(timeFits(a)?2:0)+(energyFits(a)?2:0)})).sort((a,b)=>b.score-a.score).slice(0,3)}
function activityCard(a,compact=false){return `<article class="activity"><div class="activity-icon">${a.image?`<img src="${esc(a.image)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:14px">`:esc(a.icon||iconFor(a.category))}</div><div class="activity-content"><h3>${esc(a.name)}</h3><p>${esc(a.category)}${a.type?` · ${esc(a.type)}`:''}</p><div class="tags"><span class="tag">◷ ${esc(a.duration)}</span><span class="tag">${esc(a.energy)} energía</span></div>${a.description&&!compact?`<p style="margin-top:9px">${esc(a.description)}</p>`:''}${a.url&&!compact?`<p style="margin-top:7px;overflow-wrap:anywhere">↗ ${esc(a.url)}</p>`:''}<div class="activity-actions"><button class="btn primary" data-start="${a.id}">Elegir esta</button>${!compact?`<button class="btn secondary" data-edit="${a.id}">Editar</button><button class="btn secondary" data-archive="${a.id}">Archivar</button>`:`<button class="btn secondary" data-detail="${a.id}">Detalles</button>`}</div></div></article>`}
function renderExplore(){let rec=recommendations();return `<div class="section-head"><div><div class="eyebrow">Tu espacio</div><h1 class="heading">Ya estás aquí.</h1><p class="sub">No hay nada que tengas que cumplir. Estas son algunas opciones para tu momento.</p></div><button class="btn secondary" id="editDaily">Editar mi pausa</button></div>
<div class="soft" style="margin-bottom:24px"><div class="daily-summary"><div class="mood-tile">${(moodOptions.find(x=>x[0]===state.mood)||moodOptions[2])[1]}</div><div style="flex:1"><h3>${({agobiado:'La mente llena',bajo:'Poca energía emocional',neutral:'Un estado neutral',tranquilo:'Un poco de calma',animado:'Buen ánimo'})[state.mood]}</h3><p>Energía ${state.energy.toLowerCase()} · ${esc(state.time)} · ${esc(state.intention)}</p></div></div>${state.dailyNote.trim()?`<p style="font-size:13px;color:#626a5c;margin:13px 0 0;font-style:italic">“${esc(state.dailyNote)}”</p>`:''}</div>
<div class="section-head" style="margin-bottom:13px"><div><h2 style="font-size:19px;margin:0 0 4px">Podrías disfrutar...</h2><p class="sub" style="font-size:12px">Opciones orientativas, según lo que elegiste.</p></div><button class="btn ghost" id="refreshRec">↻ Ver otras</button></div>
<div class="activity-list">${rec.length?rec.map(a=>activityCard(a,true)).join(''):`<div class="empty"><div class="symbol">✧</div><h3>Tu próxima idea puede empezar aquí</h3><p>Agrega una actividad a tu biblioteca para que podamos sugerírtela.</p><button class="btn primary" data-goto="actividades">Ir a actividades</button></div>`}</div><button class="btn secondary full" id="browseAll">Explorar todas las actividades</button>`}
function renderActivities(){const list=state.activities.filter(a=>(state.filter==='Todas'||a.category===state.filter)&&(a.name+' '+a.category+' '+(a.description||'')).toLowerCase().includes(state.search.toLowerCase()));return `<div class="section-head"><div><div class="eyebrow">Tu colección personal</div><h1 class="heading">Actividades</h1><p class="sub">Cosas que disfrutas, ideas para después y experiencias que te gustaría vivir.</p></div><button class="btn primary" id="addActivity">＋ Añadir actividad</button></div>
<div class="library-toolbar"><input class="search" id="searchActivity" placeholder="Buscar actividades..." value="${esc(state.search)}"><select id="filterCategory">${['Todas',...cats].map(c=>`<option ${state.filter===c?'selected':''}>${c}</option>`).join('')}</select></div>
<div class="small-label" style="margin-bottom:12px">${list.length} actividad${list.length===1?'':'es'} · las actividades archivadas quedan fuera de la biblioteca activa</div>
<div class="activity-list">${list.length?list.map(a=>activityCard(a)).join(''):`<div class="empty"><div class="symbol">▤</div><h3>No hay actividades aquí</h3><p>Prueba otra búsqueda o agrega una idea nueva.</p><button class="btn primary" id="addActivityEmpty">Añadir actividad</button></div>`}</div>
${state.activities.some(a=>a.status==='Archivada')?`<div class="field"><h3>Archivo</h3><div class="activity-list">${state.activities.filter(a=>a.status==='Archivada').map(a=>`<article class="activity"><div class="activity-icon">${esc(a.icon||'✧')}</div><div class="activity-content"><h3>${esc(a.name)}</h3><p>${esc(a.category)} · Archivada</p><div class="activity-actions"><button class="btn secondary" data-restore="${a.id}">Restaurar</button></div></div></article>`).join('')}</div></div>`:''}`}
function renderSession(){let s=state.activeSession;if(!s)return `<div class="section-head"><div><div class="eyebrow">Tu momento, a tu ritmo</div><h1 class="heading">Elige una actividad</h1><p class="sub">Selecciona algo de tu biblioteca para comenzar.</p></div></div><button class="btn primary" data-goto="actividades">Ver actividades</button>`;return `<button class="btn ghost" id="backExplore">← Volver a explorar</button><div class="session-card" style="margin-top:18px"><div class="session-symbol">${esc(s.icon||'☼')}</div><div class="eyebrow">Un momento para ti</div><h2>${esc(s.name)}</h2><p>No necesitas llegar a ningún resultado. Puedes parar cuando quieras.</p><div class="timer" id="timerDisplay">${formatDuration(sessionSeconds(s))}</div><div class="small-label">Tiempo activo · sin contar las pausas</div><div class="inline-actions" style="justify-content:center;margin-top:18px">${s.status==='active'?`<button class="btn secondary" id="pauseSession">Ⅱ Pausar</button>`:`<button class="btn primary" id="resumeSession">▶ Reanudar</button>`}<button class="btn primary" id="finishSession">Terminar y guardar</button><button class="btn secondary" id="interruptSession">Salir sin guardar</button></div></div><div class="field"><h3>Si quieres, deja una nota</h3><textarea id="sessionNote" class="note" placeholder="¿Qué te gustaría recordar de este momento?">${esc(s.note||'')}</textarea><div class="hint">La nota se guarda con la sesión. Es opcional.</div></div>`}
function formatDuration(seconds){seconds=Math.max(0,Math.floor(seconds));let h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60),s=seconds%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')}
function sessionSeconds(s){let total=s.accumulated||0;if(s.status==='active'&&s.startedSegment)total+=Math.max(0,Math.floor((Date.now()-s.startedSegment)/1000));return total}
function renderHistory(){let sessions=[...state.history].reverse();let counts=moodOptions.map(m=>({name:m[2],emoji:m[1],count:state.history.filter(h=>h.mood===m[0]).length}));let total=counts.reduce((n,x)=>n+x.count,0);return `<div class="section-head"><div><div class="eyebrow">Tus experiencias</div><h1 class="heading">Mi historia</h1><p class="sub">Un registro amable de lo que has vivido, sin calificaciones.</p></div></div><div class="soft"><h3 style="margin-bottom:14px">Este mes · vista de demostración</h3><div class="grid2"><div class="stat"><div class="symbol">♡</div><strong>${state.history.length}</strong><span>Sesiones registradas</span></div><div class="stat"><div class="symbol">▤</div><strong>${state.activities.filter(a=>a.status!=='Archivada').length}</strong><span>Ideas disponibles</span></div></div><div style="margin-top:18px;font-size:13px;font-weight:650">Estados emocionales registrados</div>${total?counts.map(c=>`<div class="barrow"><span>${c.emoji} ${c.name}</span><div class="bar"><i style="width:${c.count/total*100}%"></i></div><span>${c.count}</span></div>`).join(''):`<p class="hint">Cuando registres tus pausas, aquí aparecerá un resumen. Los días sin registro no cuentan como algo negativo.</p>`}</div><div class="field"><div class="section-head" style="margin-bottom:12px"><div><h2 style="font-size:19px;margin:0">Sesiones recientes</h2><p class="sub" style="font-size:12px">Tus momentos guardados.</p></div></div>${sessions.length?sessions.map(h=>`<div class="session-item"><div class="activity-icon" style="width:40px;height:40px;flex-basis:40px">${esc(h.icon||'☼')}</div><div style="flex:1"><h4>${esc(h.name)}</h4><p>${esc(h.date)} · ${formatDuration(h.seconds||0)} de tiempo activo${h.mood?` · Estado: ${esc((moodOptions.find(m=>m[0]===h.mood)||[])[2]||'')}`:''}</p>${h.note?`<p style="margin-top:7px;color:#4f5e50">${esc(h.note)}</p>`:''}</div><button class="btn secondary" data-repeat="${h.activityId||''}">Repetir</button></div>`).join(''):`<div class="empty"><div class="symbol">◷</div><h3>Aquí se irá formando tu historia</h3><p>Cuando termines una actividad y guardes la sesión, aparecerá aquí. No necesitas registrar cada momento de tu vida.</p><button class="btn primary" data-goto="actividades">Elegir una actividad</button></div>`}</div>`}
function render(){const main=$('#main');main.innerHTML=state.tab==='pausa'?renderPausa():state.tab==='explorar'?renderExplore():state.tab==='actividades'?renderActivities():state.tab==='sesion'?renderSession():renderHistory();bindView();}
function openModal(id=null){state.editingId=id;let a=id?state.activities.find(x=>x.id===id):null;$('#modalTitle').textContent=a?'Editar actividad':'Nueva actividad';$('#modalBody').innerHTML=`<form id="activityForm"><div class="form-grid"><div class="form-row fullrow"><label for="fName">Nombre *</label><input id="fName" name="name" required maxlength="120" placeholder="Ej. Aprender una canción" value="${esc(a?.name||'')}"></div><div class="form-row"><label for="fType">Tipo</label><select id="fType" name="type">${['Recurrente','Idea específica','Experiencia'].map(x=>`<option ${a?.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-row"><label for="fCategory">Categoría</label><select id="fCategory" name="category">${cats.map(x=>`<option ${a?.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-row"><label for="fDuration">Duración habitual</label><select id="fDuration" name="duration">${durationOptions.map(x=>`<option ${a?.duration===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-row"><label for="fEnergy">Energía necesaria</label><select id="fEnergy" name="energy">${energyOptions.map(x=>`<option ${a?.energy===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-row fullrow"><label for="fDescription">Descripción o notas (opcional)</label><textarea id="fDescription" name="description" placeholder="Un detalle que quieras recordar...">${esc(a?.description||'')}</textarea></div><div class="form-row fullrow"><label for="fUrl">Enlace (opcional)</label><input id="fUrl" name="url" type="url" placeholder="https://..." value="${esc(a?.url||'')}"><div class="hint">En la aplicación real se intentará crear una vista previa si el sitio lo permite.</div><div id="previewDemo" class="link-preview ${a?.url?'':'hidden'}">↗ <span>${esc(a?.url||'La vista previa aparecerá aquí cuando sea posible.')}</span></div></div><div class="form-row fullrow"><label for="fImage">Imagen propia (opcional)</label><input id="fImage" name="image" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><div class="hint">La imagen se conserva en esta demostración mientras la página siga abierta. En la aplicación real se guardará en el servidor.</div>${a?.image?`<img src="${esc(a.image)}" alt="Imagen actual" style="width:90px;height:90px;object-fit:cover;border-radius:12px;margin-top:8px">`:''}</div></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">Cancelar</button><button type="submit" class="btn primary">Guardar actividad</button></div></form>`;$('#modalBackdrop').classList.add('open');$('#fUrl').addEventListener('input',e=>{let p=$('#previewDemo');p.classList.toggle('hidden',!e.target.value);$('span',p).textContent=e.target.value||''});$('#cancelModal').addEventListener('click',closeModal);$('#activityForm').addEventListener('submit',saveActivity)}
function closeModal(){$('#modalBackdrop').classList.remove('open');state.editingId=null}
function saveActivity(e){e.preventDefault();const f=new FormData(e.target),file=$('#fImage').files[0];const old=state.editingId?state.activities.find(a=>a.id===state.editingId):null;const save=image=>{const obj={id:old?.id||Math.max(0,...state.activities.map(a=>a.id))+1,name:f.get('name').trim(),type:f.get('type'),category:f.get('category'),duration:f.get('duration'),energy:f.get('energy'),description:f.get('description').trim(),url:f.get('url').trim(),image:image||'',icon:iconFor(f.get('category')),status:old?.status||'Pendiente'};if(old)state.activities=state.activities.map(a=>a.id===old.id?obj:a);else state.activities.push(obj);closeModal();render();toast(old?'Actividad actualizada':'Actividad añadida a tu colección')};if(file){if(!file.type.startsWith('image/')){toast('Elige un archivo de imagen válido');return}if(file.size>2*1024*1024){toast('Para esta demo, el límite es 2 MB');return}const reader=new FileReader();reader.onload=()=>save(reader.result);reader.readAsDataURL(file)}else save(old?.image||'')}
function bindView(){
$$('[data-mood]').forEach(b=>b.onclick=()=>{state.mood=b.dataset.mood;render()});$$('[data-energy]').forEach(b=>b.onclick=()=>{state.energy=b.dataset.energy;render()});$$('[data-time]').forEach(b=>b.onclick=()=>{state.time=b.dataset.time;render()});$$('[data-intention]').forEach(b=>b.onclick=()=>{state.intention=b.dataset.intention;render()});
const daily=$('#dailyNote');if(daily)daily.addEventListener('input',e=>state.dailyNote=e.target.value);
$('#enterExplore')?.addEventListener('click',()=>{state.dailySaved=true;setTab('explorar');toast('Tu pausa está lista')});$('#editDaily')?.addEventListener('click',()=>setTab('pausa'));$('#browseAll')?.addEventListener('click',()=>setTab('actividades'));$('#refreshRec')?.addEventListener('click',()=>{state.activities.sort(()=>Math.random()-.5);render();toast('Aquí tienes otras opciones')});
$('#addActivity')?.addEventListener('click',()=>openModal());$('#addActivityEmpty')?.addEventListener('click',()=>openModal());$('#searchActivity')?.addEventListener('input',e=>{state.search=e.target.value;const pos=e.target.selectionStart;render();const inp=$('#searchActivity');inp.focus();inp.setSelectionRange(pos,pos)});$('#filterCategory')?.addEventListener('change',e=>{state.filter=e.target.value;render()});
$$('[data-start]').forEach(b=>b.onclick=()=>startSession(Number(b.dataset.start)));$$('[data-detail]').forEach(b=>b.onclick=()=>{const a=state.activities.find(x=>x.id===Number(b.dataset.detail));if(a)showDetail(a)});$$('[data-edit]').forEach(b=>b.onclick=()=>openModal(Number(b.dataset.edit)));$$('[data-archive]').forEach(b=>b.onclick=()=>{const a=state.activities.find(x=>x.id===Number(b.dataset.archive));if(a&&confirm(`¿Archivar “${a.name}”? Se conservará su historial.`)){a.status='Archivada';render();toast('Actividad archivada')}});$$('[data-restore]').forEach(b=>b.onclick=()=>{const a=state.activities.find(x=>x.id===Number(b.dataset.restore));if(a){a.status='Pendiente';render();toast('Actividad restaurada')}});$$('[data-goto]').forEach(b=>b.onclick=()=>setTab(b.dataset.goto));
$('#backExplore')?.addEventListener('click',()=>setTab('explorar'));$('#pauseSession')?.addEventListener('click',()=>{let s=state.activeSession;s.accumulated=sessionSeconds(s);s.status='paused';s.startedSegment=null;render();toast('Sesión en pausa')});$('#resumeSession')?.addEventListener('click',()=>{state.activeSession.status='active';state.activeSession.startedSegment=Date.now();render();toast('Continúa a tu ritmo')});$('#sessionNote')?.addEventListener('input',e=>{if(state.activeSession)state.activeSession.note=e.target.value});$('#finishSession')?.addEventListener('click',finishSession);$('#interruptSession')?.addEventListener('click',()=>{if(confirm('¿Salir sin guardar esta sesión como experiencia finalizada?')){state.activeSession=null;setTab('explorar');toast('Sesión interrumpida sin registrar')}});
$$('[data-repeat]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.repeat),a=state.activities.find(x=>x.id===id);if(a)startSession(id);else setTab('actividades')});
}
function startSession(id){const a=state.activities.find(x=>x.id===id);if(!a)return;state.activeSession={activityId:a.id,name:a.name,icon:a.icon,status:'active',startedSegment:Date.now(),accumulated:0,note:'',mood:state.mood};setTab('sesion')}
function finishSession(){const s=state.activeSession;if(!s)return;s.accumulated=sessionSeconds(s);state.history.push({id:Date.now(),activityId:s.activityId,name:s.name,icon:s.icon,date:new Date().toLocaleString('es-MX',{day:'numeric',month:'short',year:'numeric'}),seconds:s.accumulated,note:($('#sessionNote')?.value||s.note||'').trim(),mood:s.mood});const a=state.activities.find(x=>x.id===s.activityId);if(a&&a.type==='Experiencia')a.status='Disfrutada';state.activeSession=null;setTab('historia');toast('Sesión guardada en tu historia')}
function showDetail(a){$('#modalTitle').textContent=a.name;$('#modalBody').innerHTML=`<div class="soft" style="text-align:center;margin-bottom:15px"><div style="font-size:35px;margin-bottom:6px">${a.image?`<img src="${esc(a.image)}" style="width:100px;height:100px;object-fit:cover;border-radius:15px">`:esc(a.icon)}</div><div style="font-family:Georgia,serif;font-size:23px">${esc(a.name)}</div><div class="small-label">${esc(a.category)} · ${esc(a.type)}</div></div><div class="barrow" style="grid-template-columns:120px 1fr"><span>Duración habitual</span><strong>${esc(a.duration)}</strong></div><div class="barrow" style="grid-template-columns:120px 1fr"><span>Energía necesaria</span><strong>${esc(a.energy)}</strong></div>${a.description?`<p style="font-size:13px;color:#626a5c">${esc(a.description)}</p>`:''}${a.url?`<div class="link-preview">↗ Enlace guardado<br><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.url)}</a></div>`:''}<div class="modal-actions"><button class="btn secondary" id="cancelModal">Cerrar</button><button class="btn primary" id="detailStart">Elegir esta</button></div>`;$('#modalBackdrop').classList.add('open');$('#cancelModal').onclick=closeModal;$('#detailStart').onclick=()=>{closeModal();startSession(a.id)}}
$('#closeModal').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();setInterval(()=>{if(state.tab==='sesion'&&state.activeSession?.status==='active'){const t=$('#timerDisplay');if(t)t.textContent=formatDuration(sessionSeconds(state.activeSession))}},1000);
</script>
</body>
</html>
